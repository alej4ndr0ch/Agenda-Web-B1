<!DOCTYPE html>
<html lang="en">
<head>
    <video class=" video-background" autoplay muted loop>
        <source src="/assets/black-hole.mp4">
      </video>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>user</title>
    <link rel="stylesheet" href="user.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="icon" type="image/png" href="/assets/formulario.png"/>
</head>
<body>
    <div class="container">
        <div class="container mt-5">
            <img src="../assets/user.svg" alt="user" width="502" height="320" style="margin-left: 340px;">
            <div style="margin-left: 450px;">
                <p id="userEmail" style="color: white;"></p>
                <p id="userPassword" style="color: white; margin-top: 30px;"></p>
                <form action="/contacto/contacto.html" method="get" class="login">
                    <div style="display: inline-block; margin-left: 100px; margin-top: 25px;">
                        <button type="submit" class="btn btn-primary">Regresar</button>
                  </div>
                  </form>
            </div>
        </div>
    </div>

    <script>
        const email = sessionStorage.getItem("email1");
        const password = sessionStorage.getItem("password1");

        document.getElementById("userEmail").textContent = `Email: ${email}`;
        document.getElementById("userPassword").textContent = `Contraseña: ${password}`;

        window.addEventListener('beforeload', function() {
            sessionStorage.clear();
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
