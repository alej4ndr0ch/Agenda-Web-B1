<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/to-do-list/to-do-list.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="icon" type="image/png" href="/assets/formulario.png"/>
    <title>Document</title>
</head>
<body>
    <video class=" video-background" autoplay muted loop>
        <source src="/assets/3d-sunset-waves.3840x2160.mp4">
    </video>
    <div class="login-container">
        <div class="container mt-5">
            <h1 class="text-center">To-Do List</h1>
            <div class="card p-4 my-2">
              <h4>Agregar una Tarea</h4>
              <form id="todoForm">
                <div class="mb-1">
                  <label for="taskName" class="form-label">Tarea</label>
                  <input type="text" id="taskName" class="form-control" placeholder="Ejemplo: Comprar leche" required>
                </div>
                <div class="mb-3">
                  <label for="taskPriority" class="form-label">Prioridad</label>
                  <select id="taskPriority" class="form-select">
                    <option value="1">Alta</option>
                    <option value="2">Media</option>
                    <option value="3">Baja</option>
                  </select>
                </div>
                    <button type="submit" class="btn btn-primary">Agregar</button>
              </form>
            </div>
            <div class="card">
              <div class="card-body">
                <h4>Tareas Pendientes</h4>
                <ul id="todoList" class="list-group"></ul>
              </div>
            </div>
          </div>
        <form action="/contacto/contacto.html" method="get" class="login">
            <button type="submit" class="btn btn-primary" style="margin-left: 120px; margin-top: 20px;">Regresar</button>
        </form>
    </div>

      <script  src="/to-do-list/to-do-list.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
