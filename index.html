<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="index-style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="icon" type="image/png" href="/assets/formulario.png"/>
</head>
<body>
  <video class=" video-background" autoplay muted loop>
    <source src="/assets/black-hole.mp4">
  </video>  
  <div class="container" style="margin-top: -150px;">
      <form id="loginForm" class="login">
        <div class="login-container">
          <div class="mt-5">
            <img src="/assets/user.svg" alt="user,png" width="502" height="320">
            <label for="email" class="form-label" style="color: aliceblue;">Email address</label>
            <input type="email" id="email" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label" style="color: aliceblue;">Contraseña</label>
            <input type="password" id="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary" style="margin-top: 25px;">Login</button>
        </div>
      </form>  

    <script>
      document.getElementById("loginForm").addEventListener("submit", function (event) {
      event.preventDefault();
      
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      sessionStorage.setItem("email1", email);
      sessionStorage.setItem("password1", password);

      window.location.href = "contacto/contacto.html";
    });
    </script>

          <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
           integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
      </div>
</body>
</html>
