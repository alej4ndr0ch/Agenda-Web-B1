<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar</title>
    <link rel="stylesheet" href="/agregar-contacto/agregar-contacto.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="icon" type="image/png" href="/assets/formulario.png"/>
</head>
<body>
  <video class=" video-background" autoplay muted loop>
    <source src="/assets/astronaut-floating.mp4">
  </video>
  <div style="margin-top: 80px; max-width: 500px; margin-left: 500px; " class="block">
    <form class="vertical-form">
      <img src="/assets/User_icon_2.png" alt="User_icon_2.png" width="180px" height="180px" style="margin-left: 120px;">
        <div class="form-group">
            <label for="validationDefault01" class="form-label" style="color: white;">Primer Nombre</label>
            <input type="text" class="form-control" id="validationDefault01" value="Mark" required>
        </div>
        <div class="form-group">
            <label for="validationServer02" class="form-label" style="color: white;">Primer apellido</label>
            <input type="text" class="form-control" id="validationServer02" value="Otto" required>
        </div>
        <div class="form-group">
          <label for="validationDefaultUsername" class="form-label" style="color: white;">Username</label>
          <div class="input-group">
            <span class="input-group-text" id="inputGroupPrepend2">@</span>
            <input type="text" class="form-control" id="validationDefaultUsername" aria-describedby="inputGroupPrepend2" required>
          </div>
        </div>
        <div class="form-group">
          <label for="validationDefaultUsername" class="form-label" style="color: white;">Correo Electronico</label>
          <div class="input-group">
            <span class="input-group-text" id="inputGroupPrepend2">@</span>
            <input type="text" class="form-control" id="validationDefaultUsername" aria-describedby="inputGroupPrepend2" required>
          </div>
        </div>
        <div class="form-group">
          <label for="validationDefault05" class="form-label" style="color: white;">Carnet</label>
          <input type="text" class="form-control" id="validationDefault05" required>
        </div>
        <div class="form-group">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" value="" id="invalidCheck2" required>
              <label class="form-check-label" for="invalidCheck2" style="color: white;">
                Esta de acuerdo con los terminos?
              </label>
            </div>
            </div>
        </div>
        <form action="/contacto/contacto.html" method="get" class="login">
          <div class="form-group" style="margin-left: 480px; margin-top: 50px;">
            <button type="submit" class="btn btn-primary">Agregar</button>
        </div>
        </form>
        <form action="/contacto/contacto.html" method="get" class="login">
          <div class="form-group" style="margin-left: 480px; margin-top: 10px;">
            <button type="submit" class="btn btn-primary">Regresar</button>
        </div>
        </form>
    </form>
</div>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
       integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</html>
